<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Backoffice ISPGAYA</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Open+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon_ispgaya.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon_ispgaya.png') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/backoffice.css') }}">
</head>

<body class="bo-login-body">

    <div class="bo-login-container">
        <div class="bo-login-card">
            <!-- Logo -->
            <div class="bo-login-logo">
                <div class="bo-login-logo__icon"><i class="fas fa-theater-masks"></i></div>
                <div>
                    <span class="bo-login-logo__name">ISPGAYA</span>
                    <span class="bo-login-logo__sub">Laboratório Cultural · Backoffice</span>
                </div>
            </div>

            <h2 class="bo-login-title">Acesso Administrativo</h2>
            <p class="bo-login-subtitle">Introduza as suas credenciais para aceder.</p>

            <!-- Erro -->
            {% if erro %}
            <div class="bo-login-erro">
                <i class="fas fa-exclamation-triangle"></i>
                {{ erro }}
            </div>
            {% endif %}

            <!-- Formulário -->
            <form method="POST" action="{{ url_for('auth.login') }}" class="bo-login-form" id="login-form" autocomplete="off" novalidate>
                <!-- Campos dummy para contornar preenchimento automático do Chrome/Windows -->
                <input type="text" name="prevent_autofill_user" style="display:none;" tabIndex="-1">
                <input type="password" name="prevent_autofill_pass" style="display:none;" tabIndex="-1">
                
                <div class="bo-form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Utilizador
                    </label>
                    <input type="text" id="username" name="username" placeholder="ex: admin" required
                        autocomplete="off" maxlength="80">
                    <span class="form-error" id="username-error"></span>
                </div>

                <div class="bo-form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Senha
                    </label>
                    <div class="bo-form-group__password">
                        <input type="text" id="password" name="password" placeholder="A sua senha" required
                            autocomplete="off" maxlength="128" style="-webkit-text-security: disc; text-security: disc;">
                        <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Mostrar senha">
                            <i class="fas fa-eye" id="toggle-pass-icon"></i>
                        </button>
                    </div>
                    <span class="form-error" id="password-error"></span>
                </div>

                <button type="submit" class="bo-login-btn" id="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </form>

            <div class="bo-login-hint">
                <i class="fas fa-info-circle"></i>
                Conta de demonstração: <code>admin</code> / <code>admin123</code>
            </div>
        </div>
    </div>

    <script>
        // Detetar se o browser suporta webkit-text-security
        const passwordInput = document.getElementById('password');
        const supportsTextSecurity = ('webkitTextSecurity' in document.documentElement.style) || ('textSecurity' in document.documentElement.style);
        if (!supportsTextSecurity && passwordInput) {
            passwordInput.type = 'password';
        }

        // Validação do lado do cliente
        document.getElementById('login-form').addEventListener('submit', function (e) {
            let valid = true;
            const username = document.getElementById('username').value.trim();
            const password = passwordInput.value;

            document.getElementById('username-error').textContent = '';
            document.getElementById('password-error').textContent = '';

            if (!username) {
                document.getElementById('username-error').textContent = 'O utilizador é obrigatório.';
                valid = false;
            }
            if (!password) {
                document.getElementById('password-error').textContent = 'A senha é obrigatória.';
                valid = false;
            }
            if (!valid) e.preventDefault();
        });

        // Toggle senha visível
        document.getElementById('toggle-pass').addEventListener('click', function () {
            const icon = document.getElementById('toggle-pass-icon');
            if (passwordInput.type === 'password') {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                icon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
            } else {
                const isMasked = passwordInput.style.webkitTextSecurity !== 'none';
                passwordInput.style.webkitTextSecurity = isMasked ? 'none' : 'disc';
                passwordInput.style.textSecurity = isMasked ? 'none' : 'disc';
                icon.className = isMasked ? 'fas fa-eye-slash' : 'fas fa-eye';
            }
        });
    </script>
</body>

</html>
