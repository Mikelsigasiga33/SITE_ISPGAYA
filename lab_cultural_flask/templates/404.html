{% extends "base.html" %}
{% block title %}Página não encontrada{% endblock %}
{% block content %}
<section
    style="min-height:60vh; display:flex; align-items:center; justify-content:center; background:var(--gray-50); padding:80px 24px; text-align:center;">
    <div>
        <div style="font-size:6rem; margin-bottom:24px;">404</div>
        <h1 style="font-size:2rem; color:var(--navy-800); margin-bottom:16px;">Página não encontrada</h1>
        <p style="color:var(--gray-500); margin-bottom:32px;">A página que procura não existe ou foi removida.</p>
        <a href="{{ url_for('frontoffice.index') }}" class="btn-primary">
            <i class="fas fa-home"></i> Voltar ao início
        </a>
    </div>
</section>
{% endblock %}
